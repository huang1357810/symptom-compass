name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 全量自测
        run: |
          set -e
          for f in tools/test-*.js; do
            echo "== $f"
            node "$f"
          done

      - name: 评测跑批
        run: |
          node tools/run-evals.js

      - name: 方向评测（禁止倒退）
        run: |
          node tools/eval-direction.js --check

      - name: 版本与文档检查
        run: |
          node tools/check-version.js
          node tools/check-docs.js

      - name: 生成物一致性
        run: |
          node tools/gen-cloud-logic.js
          node tools/gen-harmony-data.js
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::生成物或评测产物与源不一致，请本地运行 tools/run-evals.js 与 tools/gen-*.js 并提交"
            git status --porcelain
            git diff --stat
            exit 1
          fi