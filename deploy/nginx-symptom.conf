server {
    # 用 8080 而不是 80：国内 ECS 的 80/443 端口需要域名备案才能开放
    listen 8080 default_server;
    listen [::]:8080 default_server;

    server_name _;

    root /var/www/symptom;
    index index.html;

    charset utf-8;

    # 单页应用：找不到文件时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # HTML 每次都校验，避免更新后浏览器拿旧缓存
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Content-Disposition "inline";
    }

    # 静态图片可长缓存
    location ~* \.(png|jpg|jpeg|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # 关闭目录列表
    autoindex off;
}
